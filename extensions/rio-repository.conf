# A rio extension repository (AGENTS.md D39, CONTRIBUTING "Extension repositories").
# Serve this directory over plain HTTP and add its URL under
# View > Extensions... > Repositories... — its presence is what marks the
# directory as a repository. This is a real, complete repository: it carries the
# vi and emacs editing modes, which the rio core ships WITHOUT (D41) so they can
# be installed, replaced, and versioned like any other extension.

name = rio built-in modes
description = the vi and emacs editing modes, distributed as installable extensions
maintainer = rio
